# /etc/ssh/sshd_config.d/10-shozz-hardening.conf
# Hardening do OpenSSH do roteador Ubuntu 24.04 (Shozz Infra Lab).
#
# O sshd_config padrão do Ubuntu inclui /etc/ssh/sshd_config.d/*.conf logo no
# início. No OpenSSH vale o PRIMEIRO valor lido para cada opção, então as
# diretivas abaixo têm precedência sobre o restante do sshd_config.
# Confira o resultado efetivo com: sshd -T

# --- Rede -------------------------------------------------------------------
# Porta coerente com o EXPOSE 2222 do Dockerfile. O laboratório é só IPv4.
Port 2222
AddressFamily inet

# --- Quem pode entrar -------------------------------------------------------
PermitRootLogin no
# "ubuntu" (UID 1000) é o usuário comum que já existe na imagem oficial.
AllowUsers ubuntu

# --- Como pode entrar: somente chave pública -------------------------------
PubkeyAuthentication yes
AuthorizedKeysFile .ssh/authorized_keys
AuthenticationMethods publickey
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitEmptyPasswords no

# --- Limites de tentativas e de sessão --------------------------------------
MaxAuthTries 3
MaxSessions 2
LoginGraceTime 30
ClientAliveInterval 300
ClientAliveCountMax 2

# --- Funcionalidades desnecessárias neste servidor --------------------------
X11Forwarding no
AllowTcpForwarding no
AllowAgentForwarding no
PermitTunnel no
PermitUserEnvironment no

# --- Divulgação de informação e auditoria -----------------------------------
# Remove o sufixo da distribuição do banner da versão do SSH.
DebianBanner no
# VERBOSE registra a impressão digital da chave usada em cada login.
LogLevel VERBOSE

# --- Criptografia: somente algoritmos modernos ------------------------------
KexAlgorithms sntrup761x25519-sha512@openssh.com,curve25519-sha256,curve25519-sha256@libssh.org
Ciphers chacha20-poly1305@openssh.com,aes256-gcm@openssh.com,aes128-gcm@openssh.com,aes256-ctr,aes192-ctr,aes128-ctr
MACs hmac-sha2-512-etm@openssh.com,hmac-sha2-256-etm@openssh.com,umac-128-etm@openssh.com
