name: shozz-infra-lab

services:
  ubuntu-router:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: shozz-ubuntu-router
    hostname: ubuntu-router
    cap_add:
      - NET_ADMIN
    sysctls:
      net.ipv4.ip_forward: "1"
    networks:
      shozz_lan:
        ipv4_address: 10.10.10.1
      shozz_wan:
        ipv4_address: 10.20.20.1

  cliente-lan:
    image: alpine:3.22
    container_name: shozz-cliente-lan
    hostname: cliente-lan
    cap_add:
      - NET_ADMIN
    command:
      - sh
      - -c
      - ip route replace 10.20.20.0/24 via 10.10.10.1 && exec sleep infinity
    networks:
      shozz_lan:
        ipv4_address: 10.10.10.10

  cliente-wan:
    image: alpine:3.22
    container_name: shozz-cliente-wan
    hostname: cliente-wan
    cap_add:
      - NET_ADMIN
    command:
      - sh
      - -c
      - ip route replace 10.10.10.0/24 via 10.20.20.1 && exec sleep infinity
    networks:
      shozz_wan:
        ipv4_address: 10.20.20.10

networks:
  shozz_lan:
    name: shozz_lan
    driver: bridge
    ipam:
      config:
        - subnet: 10.10.10.0/24
          gateway: 10.10.10.254

  shozz_wan:
    name: shozz_wan
    driver: bridge
    ipam:
      config:
        - subnet: 10.20.20.0/24
          gateway: 10.20.20.254

